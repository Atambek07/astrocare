services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -e 'backend[dev]' &&
             PYTHONPATH=backend/src:/app ASTRO_DOCTOR_OFFLINE=1
             python -m astro_brain.astrocare_service
             --port 8765 --ws-port 8787"
    volumes:
      - ./:/app
    ports:
      - "8765:8765"
      - "8787:8787"
    environment:
      ASTRO_DOCTOR_OFFLINE: "1"

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --port 3000 --hostname 0.0.0.0"
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BRAIN_WS_URL: ws://localhost:8787
      NEXT_PUBLIC_BACKEND_HTTP_URL: http://localhost:8765
    depends_on:
      - backend
